name: Build and deploy

# Builds the site from site.jsonc and publishes it to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:          # build + check only, never deploys
  schedule:
    - cron: "23 7 * * *" # every day, so "next meetup" moves on and past events drop off
  workflow_dispatch:     # "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to exact versions for safety; Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Find the site address
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build and check
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        # The original template repo publishes a showcase page with example sites instead.
        # Your copy builds your own site.
        run: |
          if [ "${GITHUB_REPOSITORY,,}" = "dmvthrowers/yoyoclub-template" ]; then
            python3 scripts/build_showcase.py
          else
            python3 build.py
            python3 scripts/check_site.py --real
          fi
      - name: Package the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
