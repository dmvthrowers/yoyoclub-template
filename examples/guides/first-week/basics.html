<h2 id="grip">Get a Grip</h2>
<p>Hold the handle in your dominant hand and keep your wrist loose. A relaxed grip gives you a cleaner catch than a tight one.[ref:practice-tips]</p>
<h2 id="stance">Find Your Stance</h2>
<p>Stand with your feet shoulder-width apart and your knees slightly bent. Face a clear space with nothing breakable nearby.</p>
